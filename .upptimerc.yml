owner: wattnet
repo: wattnet-status

sites:
    # --- Public-facing / user experience ---
    - name: Wattnet Website
      url: https://wattnet.eu

    - name: Authentication Service
      url: https://auth.wattnet.eu
      icon: https://www.google.com/s2/favicons?domain=wattnet.eu&sz=64

    - name: API Service
      url: https://api.wattnet.eu

    - name: Web Dashboard
      url: https://dashboard.wattnet.eu

    - name: Documentation
      url: https://docs.wattnet.eu

    # --- Datasources (public info, open source project) ---
    - name: ENTSO-E Transparency Platform
      url: https://web-api.tp.entsoe.eu/api
      expectedStatusCodes:
          - 401 # requires a token; a 401 confirms the service is alive and responding normally
      icon: https://www.google.com/s2/favicons?domain=entsoe.eu&sz=64

    - name: Elexon Insights Solution
      url: https://data.elexon.co.uk/bmrs/api/v1/datasets/FREQ
      icon: https://www.google.com/s2/favicons?domain=elexon.co.uk&sz=64

    - name: EPIAS Transparency Platform
      url: https://seffaflik.epias.com.tr/electricity-service/technical/tr/index.html

status-website:
    name: Wattnet Services Status
    logoUrl: https://raw.githubusercontent.com/wattnet/wattnet-status/master/assets/wattnet-logo.png
    baseUrl: /wattnet-status
    cname: ""
    favicon: https://wattnet.eu/favicon.ico
    metaDescription: "Real-time status of Wattnet's online services and data sources availability."
    introTitle: >
        Tracking Europe's electricity footprint, in real time.
    introMessage: >
        Real-time status of Wattnet's online services and data sources availability.
    navbar:
        - title: Status
          href: /
        - title: GitHub
          href: https://github.com/wattnet/wattnet-status
delay-between-runs: 5
assignees:
    - jaimeib
