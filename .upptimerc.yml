owner: wattnet
repo: wattnet-status

sites:
    # --- Public-facing / user experience ---
    - name: Wattnet (Main Website)
      url: https://wattnet.eu

    - name: Auth
      url: https://auth.wattnet.eu

    - name: API
      url: https://api.wattnet.eu

    - name: Dashboard
      url: https://dashboard.wattnet.eu

    - name: Docs
      url: https://docs.wattnet.eu

    # --- Datasources (public info, open source project) ---
    - name: ENTSO-E Transparency Platform
      url: https://web-api.tp.entsoe.eu/api
      expectedStatusCodes:
          - 401 # requires a token; a 401 confirms the service is alive and responding normally

    - name: Elexon Insights Solution
      url: https://data.elexon.co.uk/bmrs/api/v1/datasets/FREQ

    - name: EPIAS Transparency Platform
      url: https://seffaflik.epias.com.tr/electricity-service/v1/consumption/data/distribution-region
      method: GET
      expectedStatusCodes:
          - 200
          - 401 # in case this route requires the TGT header depending on environment; adjust after testing

status-website:
    name: Wattnet Status
    cname: "" # leave empty until your DNS is ready
    favicon: https://wattnet.eu/favicon.ico
    introTitle: >
        Real-time status of Wattnet's services and data sources.
    navbar:
        - title: Status
          href: /
        - title: GitHub
          href: https://github.com/wattnet/wattnet-status

delay-between-runs: 5
assignees: [] # add your GitHub username here if you want incident issues auto-assigned to you
